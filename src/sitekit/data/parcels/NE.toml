notes = "County_ID is the 3-digit county FIPS without the state prefix ('055' Douglas, '109' Lancaster). State_PID = County_ID + Parcel_ID, but the separator differs by county (Douglas: '055' + '310190003' with the leading 0 of Parcel_ID dropped). Situs_Address format varies by county (Lancaster includes city/state/zip, Douglas does not); Ph_City and Situs_Address can be blank. Some locations return stacked/duplicate polygons (2 hits at one Omaha point). Some exempt parcels (e.g. the Lincoln Capitol block) return no polygon."

