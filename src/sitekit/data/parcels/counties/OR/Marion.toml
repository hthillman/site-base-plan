notes = "MapServer layer (native Web Mercator), reprojects on outSR. TAXLOT is the 13-character map+taxlot with no spaces, e.g. '073W27AB00800' (T7S R3W sec 27 AB, taxlot 00800); TAXLOTNS is the same; TAXACCT is the numeric account as text without the 'R' ('589038'). SITUS is the street ('100 HIGH ST NE'); SITUSCSZ holds situs 'CITY, OR, ZIP' in one string, so no city_field (CITY is the city jurisdiction). INSTNUM is the last recorded instrument number (reel+page style, e.g. '46940110') with INSTTYPE and INSTDATE. BLOCK and LOT are separate. Condominium units are stacked polygons over the common-element lot, so a point can return a unit (TAXLOT ending 9xxxx) rather than the base lot. REFLINK and MAPLINK point to the Assessor summary and map PDF."

