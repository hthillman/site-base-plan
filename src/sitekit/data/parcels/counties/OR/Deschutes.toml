notes = "MapServer layer (native Web Mercator), reprojects on outSR. This layer is a join, so every field name is table-qualified ('Taxlot_Assessor_Account.TAXLOT', 'dbo_GIS_MAILING.OWNER'); use the qualified names in where clauses and when reading attributes. TAXLOT is the 13-character map+taxlot with no spaces, e.g. '171232AA06300' (T17 R12 sec 32 AA, taxlot 06300); ACCOUNT_ID is the Assessor account ('103228'). A taxlot with several accounts appears once per account (112k rows over 109.5k taxlots). Address is the situs street ('1300 NW WALL ST'), City/Zip the situs city and ZIP; M_* fields are mailing. Block and Lot are separate. Fallback with unqualified names but geometry and taxlot ID only: https://maps.deschutes.org/arcgis/rest/services/OpenData/LandFD/MapServer/2 (TAXLOT field)."

