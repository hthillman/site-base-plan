notes = "Oregon Metro RLIS regional layer covering all of Clackamas, Multnomah and Washington counties (rural areas included, not just inside the UGB); hosted FeatureServer layer id 3, native EPSG:2913 (OR North ft intl, HARN); reprojects on outSR. COUNTY holds 'C', 'M' or 'W' for the source county; because the same layer serves three counties, add COUNTY = 'W' to APN where clauses (Multnomah and Washington accounts share the 'R'+digits pattern). TLID is the county map-and-taxlot ID in that county's own format; PRIMACCNUM is the primary Assessor account; ALTACCNUM a secondary account where one exists. SITEADDR / SITECITY / SITEZIP are situs; JURIS_CITY is the jurisdiction. Ownership names are deliberately excluded (OWNERTYPE / PUBLIC_OWN give only the owner class). ORTAXLOT is the statewide ORMAP taxlot key; for Washington County it often holds a placeholder value, so do not rely on it there. Data refreshed quarterly from the county assessors (last data update 2026-07-17; layer edited 2026-08-26). Washington TLID is a 12-character map+taxlot with no spaces ('1N231CC01800'); PRIMACCNUM is the 'R' account ('R702181'). Condo units have their own TLIDs in the 9xxxx range (e.g. 1N231CC90001)."

filter = "COUNTY = 'W'"  # shared Metro RLIS layer: only this county's tax lots

