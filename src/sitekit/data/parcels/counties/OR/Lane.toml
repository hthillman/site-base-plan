notes = "MapServer layer 2, native EPSG:2914 (OR South ft intl, HARN); reprojects on outSR. MAPTAXLOT is the 13-character map+taxlot with no spaces, e.g. '1703311110000' (township 17, range 03, section 31, quarter 11, taxlot 10000); MAPNUMBER and TAXLOT are its parts. ACCTNO and PROPACCT are the 7-digit zero-padded account ('0258630'); right-of-way polygons carry '000None'. No situs address on the taxlot layer: layer 0 'Address (Site)' on the same service has concat_address, city_name and maptaxlot for joining. OWNNAME is the owner name; ADDR1..3/OWNERCITY are mailing. ZONING, UGB, GEOCITY and many district fields are included. Layer minScale 20000 only affects drawing."

