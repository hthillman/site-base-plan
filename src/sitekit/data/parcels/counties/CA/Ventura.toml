notes = "Hosted FeatureServer, native SR Web Mercator; reprojects on request (2229 tested). APN is 9 digits with no dashes ('083006132'); APN10 is the 10-digit form with the trailing suffix digit ('0830061325', the attributed county copy calls it APN_SUFFIX). Printed APNs are dashed (e.g. 083-0-061-325), so strip dashes and try the first 9 digits against APN, all 10 against APN10. Fields are only APN, APN10, LAT, LON: no situs, owner, deed or legal attributes. The county's own server also exposes an attributed copy (maps.ventura.org/arcgis/rest/services/SDs/Parcels/FeatureServer/0, with SITUS, DOC_NR, TRACT) but it is not published as open data and the Assessor restricts roll attributes, so it is not used here."

