notes = "Hosted FeatureServer, native SR EPSG 2227 (CA zone 3 ftUS); reprojects on request (2229 tested). APN is 8 digits with no dashes ('14916014', printed 149-160-14); dashed input returns 0, so strip dashes. LINK is a 9-digit variant with an extra digit ('149160014'). APN is not unique: some APNs have several polygons (multi-part parcels), so union all features for an APN. FULL_ADDRESS is the full situs line including city, state and ZIP ('44 N SAN JOAQUIN ST STOCKTON CA 95202'); SITUSCITY is a 2-4 letter code ('ST' = Stockton, 'UN..' = unincorporated areas), not a city name. MAILING_ADDRESS / MAIL* fields are the owner mailing address; CAREOF is a care-of line (often the agency for public parcels), not the owner name, so no owner field is mapped. No deed, plat or legal fields."

