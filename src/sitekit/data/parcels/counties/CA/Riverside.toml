notes = "MapServer layer 50 (PARCELS_CREST) in the OpenData/Assessor service; native SR EPSG 2230, reprojects on request (2229 tested). APN is a 9-digit string with no dashes, e.g. '215372014' (printed 215-372-014); dashed input returns 0, so strip dashes. SITUS_STREET is the site street line; CITY is the situs city name (SITUS_CITY is city+state+ZIP, e.g. 'RIVERSIDE  CA 92501'); MAIL_STREET / MAIL_CITY are the owner mailing address. No owner name field is published here despite the layer description listing PRIMARY_OWNER. MAP_BOOK_PAGE is the recorded map reference (RECORDER_MAP_TYPE + BOOK/PAGE, e.g. 'MB 7/34'; types AM assessor map, CM condo map, MB map book, PM parcel map, RS record of survey). FLAG marks special parcels (PI possessory interest, condos, mobile homes). Layer 40 (PARCELS) is the same geometry with only APN/FLAG and includes ROW polygons. The server returns HTTP 403 to the default Python-urllib User-Agent (python-requests, curl and browser UAs get 200), so send an explicit User-Agent."

