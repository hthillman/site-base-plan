notes = "Hosted FeatureServer, native SR Web Mercator; reprojects on request (2227 and 2229 tested). APN is the unpadded printed form book-page-parcel[-subparcel], e.g. '2-91-2' or '48-5597-3-1' (PrintParcel is identical). Zero-padded input such as '002-0091-002-00' returns nothing, so strip leading zeros from each part and drop a trailing '-00'/'-0' sub-parcel. APN_SORT is the padded sort key ('002 009100200': 3-digit book, space, 4-digit page, 3-digit parcel, 2-digit sub-parcel). SitusAddress is the full situs line including city and ZIP ('1225 FALLON ST OAKLAND 94612'); SitusStreetNumber/SitusStreetName/SitusUnit hold the parts and SitusCity the situs city. MailingAddress* fields are the owner mailing address. No owner name, legal or plat fields; LatestDocument_Prefix + LatestDocumentSeries give the latest recorded document (e.g. 2000-071033)."

