notes = "Hosted FeatureServer, native SR EPSG 2229 (CA zone 5 ftUS); reprojection tested to 2228. APN is dashed 3-3-3 ('029-121-022'); undashed input returns 0, so insert dashes. Situs1 is the situs street line, Situs2 is 'CITY, CA ZIP', SCity the situs city. LAYER classifies each record ('Ground', 'Condo First Floor' ... 'Condo Ninth Floor', 'Mobile Home', 'Cabin', 'Basement', 'Island', 'Right of Way (Private)'); condo floors are stacked over the ground parcel, so for a base plan prefer LAYER = 'Ground'. DocNum is the latest recorded document number. No owner, legal or plat fields; BkPgLnk links the assessor map page. The layer was digitized from assessor map pages in the late 1990s and rubber-sheeted, so positional accuracy varies."

