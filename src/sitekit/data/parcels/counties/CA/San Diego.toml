notes = "MapServer layer, native SR EPSG 2230 (CA zone 6 ftUS); reprojects on request (2229 tested). APN is the 10-digit assessor number with no dashes, e.g. '5335900100' (printed form is 533-590-01-00); APN_8 is the first 8 digits (book-page-parcel, '53359001'). Users who type 533-590-01-00 need dashes stripped. Condos and possessory-interest records (APNs starting 760 etc.) are stacked duplicate polygons on the same footprint, so a point query can return many features (12 at the County Administration Center, 161 at a condo tower); prefer the record with ACREAGE set / lowest stacking or match by APN. No single situs string: the address is split into SITUS_ADDRESS (house number, integer), SITUS_PRE_DIR, SITUS_STREET, SITUS_SUFFIX, SITUS_POST_DIR, SITUS_SUITE, SITUS_ZIP, so situs_field is left empty and must be assembled. SITUS_JURIS is a 2-letter jurisdiction code ('SD' = City of San Diego, 'CN' = unincorporated), not a city name. Owner names are redacted in this public layer; no deed, plat or legal fields. Do not label the drawing as SanGIS-sourced at large scales without the 'derived from' wording (SanGIS asks not to be cited as sole source below 1:24,000)."

