notes = "MapServer layer 3 ('Parcel Boundaries, Level 16-20') in the PARCELS service; native SR EPSG 2226 (CA zone 2 ftUS), reprojects on request (2229 tested). Three APN forms are stored: APN_DASH '002-0143-017-0000' (3-4-3-4, zero padded), APN10 '0020143017' (book-page-parcel, no sub-parcel) and PARCEL_NUMBER '00201430170000' (14 digits). Users often type the short printed form 002-0143-017, so pad and try APN10 first if no 4-digit suffix is given. SITUS_ADD1 is the situs street line, SITUS_ADD2 is 'CITY, CA ZIP', CITY is the situs city; MAIL1/MAIL2/MAIL_CITY are the owner mailing address. NAME/OWNER/CARE_OF_NAME all read 'OWNER OF RECORD' (owners withheld), so no owner field is mapped. RECORDED_DOCUMENT_LABEL is the latest recorded document as 'YYYYMMDD.O.R.page' (e.g. '20181214.O.R.1377'). SUBDIVISION holds the subdivision code ('S281008'), SUB_NAME its name, LOT the lot. Layer 8 (Active GIS Parcel Base) has the same schema. The county open data portal also hosts a slimmer copy at services1.arcgis.com/5NARefyPVtAeuJPU/arcgis/rest/services/Parcels/FeatureServer/0 (field APN = 14-digit form, explicit CC public domain license)."

