notes = "Hosted FeatureServer, native SR EPSG 2227 (CA zone 3 ftUS); reprojects on request (2229 and 2226 tested). APN is 8 digits with no dashes ('25904010'); APNdashed is the printed 3-2-3 form ('259-04-010'). Situs_Address_Full is the full situs line including city, state and ZIP ('70 W HEDDING ST SAN JOSE CA 95110'); there is no separate situs city field (AGOL_Situs_Search is a search helper without the direction). Document_Number is the last recorded document number (space-padded). No owner, legal or plat fields. The County's own mapservices.sccgov.org SCCProperty service was unreachable (TLS certificate for another host, then 404) on the test date, so this Planning-hosted copy is used."

