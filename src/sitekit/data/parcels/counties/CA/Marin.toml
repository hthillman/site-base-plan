notes = "FeatureServer layer 13 ('Parcel') of the county BaseMap service; native SR EPSG 2872 (CA zone 3 ftUS HARN); reprojects on request (2226 and 2229 tested). Prop_ID is the APN in dashed 3-3-2 form ('179-270-11'); undashed input returns 0, so insert dashes. SitusFormatted is the situs street line (trailing space); SitusFormattedCity is 'street, CITY'; Jurisdiction is the city or unincorporated area the parcel lies in (not a postal city), so city_field is left empty. PublicOwnerNameStandard is filled only for publicly owned parcels (about 4,200, e.g. 'COUNTY OF MARIN') and empty for private owners. No deed, plat or legal fields. The county also publishes a geometry-only copy on ArcGIS Online (services6.arcgis.com/T8eS7sop5hLmgRRH/arcgis/rest/services/PARCEL1/FeatureServer/0, APN field 'Parcel', same disclaimer). The server returns HTTP 403 to the default Python-urllib User-Agent (python-requests, curl and browser UAs get 200), so send an explicit User-Agent."

