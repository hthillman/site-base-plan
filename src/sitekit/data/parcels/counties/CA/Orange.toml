notes = "FeatureServer, native SR EPSG 2230; reprojects on request (2229 tested). Geometry is LEGAL LOTS joined to assessor attributes, not one outline per APN: a parcel spanning several recorded lots returns one polygon per lot (APN '008-067-47', Santa Ana City Hall, returns 10), so union all features for an APN to draw the parcel. Condos are stacked identical polygons covering the whole lot. AssessmentNo keeps dashes: regular parcels are 3-3-2 ('008-067-47'), condo/unit APNs 3-2-3 ('930-45-060'); undashed input ('00806747') returns nothing, so insert dashes. SiteAddress is the situs street line (often null on public property); SiteCityState is the situs city (no state despite the name); MailAddress is the owner mailing address. 'Name' is the lot/block label ('1 / C'), not an owner; there is no owner field. DocNum is the recorded map book/page (e.g. 'MM 203/5-20', or '<MAP>' when unknown); MapNum is the tract ('TR 5438'); DocRefNo is the latest recorded document number (12 digits, year first). Same server also publishes an assessor-outline layer at Map_Layers/Parcels/FeatureServer/0 (ASSESSMENT_NO, SITE_ADDRESS only) as a fallback."

