notes = "FeatureServer, native SR EPSG 2228 (CA zone 4 ftUS); reprojects on request (2229 tested). APN is 12 digits with no dashes ('002244099000'); APN_FORMAT is the dashed 3-3-3-3 form ('002-244-099-000'). Printed APNs often omit the trailing '-000', so append it when only 9 digits are given. No situs address field and no owner field. City is the incorporated city name or blank/unincorporated (a jurisdiction, not a postal situs city), so city_field is left empty; Jurisdiction and Community are also available. Legal_Description holds the assessor legal ('RIKERS ADD TO SALINAS POR LOTS E F G & H BLK 6'); Subdivision is often the literal string 'None'. Current_Document_Number is the latest recorded document (trailing spaces). Many overlay attributes (zoning, flood, fire hazard, coastal zone) are included."

