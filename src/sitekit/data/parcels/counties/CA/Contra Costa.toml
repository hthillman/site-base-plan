notes = "MapServer layer behind the county's public Parcel Viewer; native SR Web Mercator, reprojects on request (2226 and 2229 tested). APN is 9 digits with no dashes ('373163001'); parcel_dashes is the printed 3-3-3 form ('373-163-001'); APN_CHECK is a separate check digit, not part of the APN. full_address_search is the situs street line (number + street, space padded; just the street name when the parcel has no number); full_address_display adds ', CITY'; s_city is the situs city (S_CTY_ABBR is a 5-letter code such as 'MRTNZ'). N_* fields and full_n_address / N_CTY_ST are the owner mailing address. No owner name field. DESC_ is a short assessor legal description; C_DED_NBR / C_DED_DT are the last deed document number and date (YYYYMMDD). assr_url links the assessor map PDF. The Assessor folder on the same server requires a token; this CCMAP layer does not."

