notes = "FeatureServer, native SR EPSG 2226; reprojects on request (2229 tested). APN keeps dashes in 3-3-3 form ('180-030-012'); undashed input returns 0, so insert dashes. SitusFormatted1 is the situs street line, SitusFormatted2 is 'CITY ST'; POCity is the situs postal city name, while SitusCity is a short code ('SR' = Santa Rosa). Type distinguishes regular parcels ('PCL') from other records. CurrentDocNum is the current recorded document ('1964R2083514'). No owner, legal or plat fields. Geometry is georeferenced from AP map pages of varying accuracy (RANK/DESCRIPTION fit notes are documented but not exposed here); not for boundary interpretation. Share-alike applies if the drawn parcel lines are redistributed as data; attribute 'County of Sonoma' on sheets."

