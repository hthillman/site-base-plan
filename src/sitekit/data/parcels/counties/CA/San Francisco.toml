notes = "Hosted FeatureServer, native SR Web Mercator; reprojects on request (2227 and 2229 tested). The APN is block+lot: blklot is the unique APN, 4-digit block + 3-character lot, no separator ('0787001' = block 0787 lot 001; lots can carry letters, e.g. '0306T002A'). Users often write '0787-001' or '0787/001', so strip separators and zero-pad the block to 4 digits. Condominium units share one 2D footprint: each unit is a separate stacked record and mapblklot is the lowest APN in the set (about 72,700 records have blklot != mapblklot), so a point query on a condo building returns many features; dedupe by mapblklot to draw the lot once. No single situs string: from_address_num / to_address_num give the address range with street_name + street_type. No owner, deed or legal fields; pw_recorded_map marks parcels on the recorded-map basemap and in_asr_secured_roll marks roll parcels. Includes zoning_code / zoning_district from Planning."

