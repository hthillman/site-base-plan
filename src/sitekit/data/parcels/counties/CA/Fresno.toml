notes = "Hosted FeatureServer on the county's own ArcGIS Enterprise, native SR Web Mercator; reprojects on request (2228 and 2229 tested). apn is the assessor number without dashes, usually 8 characters but with letter suffixes on some parcels ('46609401T', '01503017ST'; printed 466-094-01T). apn12 is the 12-digit padded form ('466094001000'). Try apn with dashes stripped first, then apn12. agency_cod is a jurisdiction code (e.g. CY county, FR, CL), not a situs city. Fields are only fid, apn, apn12, agency_cod, active_dat, roll_year: no situs, owner, deed or legal attributes. The same server has an attributed FC_PARCEL_SELECT MapServer (owner names, site address) that backs the county permit system; it is not used here because the county says ownership is not provided online and that layer carries no public-use statement."

