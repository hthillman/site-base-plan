notes = "MapServer layer, native SR Web Mercator; reprojects to State Plane on request. AIN is the 10-digit assessor ID with no separators, e.g. '5161004909'; APN is the same number dashed 4-3-3, e.g. '5161-004-909'. Users usually type the dashed form, so try APN with dashes and AIN with digits only. SitusAddress is the street line ('500 W TEMPLE ST'); SitusFullAddress adds city/state/ZIP. SitusCity carries a trailing ' CA' ('LOS ANGELES CA'), so strip it for display. No owner name field (LA County does not publish owners in this layer). No deed or plat book fields; Assr_Map holds the assessor map reference."

