notes = "MapServer layer. HCAD_NUM is the 13-digit HCAD account as a string with no separators, e.g. '0010320000001' (acct_num and LOWPARCELID hold the same value for normal parcels). No single situs-address field: the site address is split into site_str_num (integer), site_str_pfx, site_str_name, site_str_sfx, site_str_sfx_dir, so situs_field is left blank and address search will not work against this layer; site_city is the situs city. Stacked=1 marks stacked parcels (condos, leases, shared footprints), so a point can return several accounts on one footprint. legal_dscr_1..4 hold the legal description in parts. No deed or plat fields."

