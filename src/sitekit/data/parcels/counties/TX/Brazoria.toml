notes = "MapServer layer 1 ('Parcel Information'); layer 0 is 'Flagged Parcels' (illegal divisions, platting issues) and should not be used. Polygons are lot-level, so one property (prop_id) can have several polygons; an APN query may return more than one. geo_id is the BCAD geographic ID like '1310-0095-200', stored space-padded to 50 characters (equality matches still work, but trim for display); prop_id / PID are the integer BCAD property ID, e.g. 181572. Owner and legal text fields are also space-padded. SITUS is like '111 / 237 E LOCUST ST' (no city); situs_city is the situs city. DOCUMENT holds the deed instrument number."

