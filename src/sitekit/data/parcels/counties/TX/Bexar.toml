notes = "MapServer layer 6 of BCAD's PAMapSearch service; it is a join, so every field name is fully qualified (e.g. 'PAMaps.dbo.web_map_property.geo_id') and must be used verbatim in where clauses and outFields. geo_id is the BCAD geographic ID 'NNNNN-NNN-NNNN' (NCB-block-lot), e.g. '00100-000-0050'; PROP_ID (integer) is the BCAD property/account ID, e.g. 101165. situs includes city and ZIP and is not always clean ('100 DOLOROSA 9 SAN ANTONIO, TX 78205'), so match with LIKE '100 %DOLOROSA%'. addr_city is the owner mailing city. Bexar County also republishes an older BCAD extract at maps.bexar.org/arcgis/rest/services/Parcels/MapServer/0 (fields PropID, AcctNumb, Situs), but its metadata dates from 2019, so the BCAD layer is preferred. No deed or plat fields."

