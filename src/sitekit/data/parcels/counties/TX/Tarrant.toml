notes = "MapServer layer. ACCOUNT is the 8-digit TAD account number as a string with leading zeros, e.g. '06138578'; TAXPIN is the GIS lot key, e.g. '14437-A' (GISLINK is TAXPIN space-padded). SITUS_ADDR is space-padded ('100 W WEATHERFORD ST          '), so trim; STREET_NO/PREDIR/STREET_NAM/STREET_TYP hold the parts. CITY is almost always blank (only ~120 rows populated), so city_field is left empty; OWNER_CITY is the mailing city. DEED_BOOK/DEED_PAGE are zero-filled ('0000000') when the deed is recorded by instrument number instead (INSTRUMENT_NO). LEGAL_1..LEGAL_4 hold the legal in parts."

