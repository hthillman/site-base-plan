notes = "MapServer layer 4 (ParcelPublishing) of the ParcelQuery service; layers 0-3 are blocks, simultaneous conveyances, map grid and survey abstracts. PARCELID is the 17-character DCAD account number as a string with no separators, e.g. '00000101154000000' (LOWPARCELID is the same for ordinary parcels). SITEADDRESS is like '1400 YOUNG ST' with no city; PSTLCITY is the owner mailing city, not situs, so city_field is blank. PRPRTYDSCRP is the short legal (e.g. 'BLK D/81 82 83 E/87 88 1/89'); CNVYNAME is the addition/conveyance name. Several attribute values are space-padded. No deed or plat book fields."

