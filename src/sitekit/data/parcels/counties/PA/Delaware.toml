notes = "PIN (= MAPID) is the map-based id 'MM-BB-PPP:SSS', e.g. '26-04-593:000'. PARID is the 11-digit folio number stored as a double (26000011400), so query it without quotes; folios users quote from the assessment site are this number. A PIN can return several polygons (multi-part parcels), so merge results. ADRCAT is the situs ('0 E BALTIMORE PK'); MUNICIPALI is a numeric municipality code. LEGAL2/LEGAL3 hold the building description and lot dimensions. No owner/deed fields."

