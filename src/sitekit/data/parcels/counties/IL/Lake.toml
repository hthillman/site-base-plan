notes = "MapServer layer 12 'Tax Parcel Information' (native SR 3857, reprojects fine). PIN is a 10-digit string with no dashes, e.g. '0821410004' (printed 08-21-410-004). situs_addr_line_1 is situs street ('18 N COUNTY ST'), situs_addr_city is the situs city. taxpayer_name is the tax-bill name. Legal is split across legdesc1..legdesc3; legal_field holds only the first part. doc_num1 is the latest sale document number, not a book/page reference. Layer 11 'Tax Parcel Lines' in the same service is geometry with fewer attributes. Do not confuse with Lake County, Indiana or other Lake counties."

