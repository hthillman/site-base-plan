notes = "FeatureServer layer id 3. Native SR is AZ Central intl ft given only as WKT (no wkid), so always pass outSR. PARCELID is 9 characters with no dashes, 8 digits plus a check digit or letter, e.g. '200490510' or '20046005V' (shown as 200-49-0510); strip dashes from user input. SITEADDRESS includes city, state and ZIP ('75 N BAILEY ST FLORENCE, AZ 85132'), so no separate situs city field (PSTLCITY is mailing). Condo units repeat the parcel geometry, so a point can return several features. RECEPTIONNO (deed) is empty for every record."

