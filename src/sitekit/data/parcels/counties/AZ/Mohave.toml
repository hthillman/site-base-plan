notes = "MapServer layer 14 (ParcelQueryLayer, native Web Mercator), reprojects on outSR. Layer 3 on the same service has the same schema but is scale-dependent; use 14. PARCEL and TAXPIN are dashed book-map-parcel strings, e.g. '304-18-064'; TPARCEL is the same without dashes ('30418064'). CITY/STATE/ZIP belong to the mailing address, not the situs, so no city field. RECPTNO is the recorder reception number of the last deed (about 2/3 populated); older deeds use REC_BOOK/REC_PAGE (0 when unused)."

