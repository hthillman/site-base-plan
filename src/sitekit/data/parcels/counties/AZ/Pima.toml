notes = "MapServer layer, native EPSG:2868; reprojects on outSR. PARCEL is a 9-character string, 8 digits plus a trailing check letter or digit, no dashes, e.g. '11720012A' (shown as 117-20-012A); strip dashes from user input. ADDRESS_OL is populated only when the parcel has exactly one situs address (ADR_STATUS = 'ONE'); blank for NONE/MULTIPLE. JURIS_OL is jurisdiction (TUCSON, UNINCORPORATED, etc.), not a postal city, so city_field is left blank. MAIL1 is the first owner/mailing line (owner name), populated after Assessor audit. MP is the Maps & Plats book+page as 5 digits ('48094' = Bk 48 Pg 94), blank for unplatted land. LEGAL1..LEGAL5 hold the legal description. DOCKET/PAGE are nearly always null, so no deed fields."

