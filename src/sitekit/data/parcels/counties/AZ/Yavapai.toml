notes = "Hosted FeatureServer layer id 1, native EPSG:2223 (AZ Central ft); reprojects on outSR. The county's own server gis.yavapaiaz.gov sits behind a Cloudflare browser challenge (HTTP 403 to scripts), so this ArcGIS Online copy is the usable endpoint. PARNUMASR is the Assessor number without dashes, e.g. '11111125B'; PARLABEL is the dashed form '111-11-125B'; PARCEL_ID is a 13-digit internal key ('1311111125022' = county 13 + book/map/parcel/split/check). One parcel can be several polygon features (a where on PARNUMASR returned 3 pieces), so union by PARNUMASR. SITUS_ADD_DOR has a trailing space and no city. NAME/ADDRESS/CITY/STATE/ZIP are the owner and mailing address, so no situs city. MAPPLAT is a combined plat reference like 'M0002/011A' (book/page). RECNUMBER and SUBBOOK/SUBPAGE hold recording references of varying meaning and are not mapped. The lighter 'Parcels_in_Yavapai_County' service has the same geometry with fewer fields."

