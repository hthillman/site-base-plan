notes = "MapServer layer (native Web Mercator), reprojects on outSR. APN is 8 digits plus optional letter with no separators, e.g. '11219113'; APN_DASH is the book-map-item form '112-19-113'. Strip dashes from user input and match APN. PHYSICAL_ADDRESS includes city and ZIP with padded spaces ('305 W WASHINGTON ST   PHOENIX  85003'); street parts are also in PHYSICAL_STREET_NUM/DIR/NAME/TYPE. DEED_NUMBER is the 11-digit recorder document number, not book/page. MCR_BOOK/MCR_PAGE are the Maricopa County Recorder plat book/page. Layer minScale 15000 only affects drawing, not query. Stacked condo parcels carry a FLOOR value."

