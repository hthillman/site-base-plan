notes = "MapServer layer (no FeatureServer). PID is a 16-digit string with no separators, e.g. '2200362022001000'; ParcelNo holds the formatted form '22 00 36 2 022 001.000' (strip spaces and dots to get PID). APP_PID differs from PID on condo/joint sub-accounts. Many text fields are space-padded (OWNERNAME, ADDR_APR, Plat_Book), so trim. Property_City is the situs city; CITY is a tax-district label like 'BIRMINGHAM-30'. Stacked duplicate polygons exist for joint accounts. No deed book/page fields."

