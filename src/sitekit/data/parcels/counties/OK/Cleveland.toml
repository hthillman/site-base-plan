notes = "Hosted FeatureServer, native EPSG:2268 (OK South ftUS, reported as wkid 102725); reprojects on outSR. UserAccount is the Assessor account 'R' + 7 digits ('R0023734') and is the cleanest key. ParcelID (= name = GISKey) is a fixed-width code with embedded runs of spaces, e.g. 'NC29AAAOT  7   6001', so exact-match only with the spacing intact. This is a parcel fabric export: about 1,800 features are retired parcels (retiredbyrecord IS NOT NULL) that can overlap current ones, so add 'retiredbyrecord IS NULL' to point queries when possible; about 1,100 current polygons have no CAMA join (UserAccount null). FormattedLocation is the situs street, LocationCity the situs city; Mailing* fields are the owner mailing address. Block, Lot, Section, Township, Range are separate fields; LegalReference is mostly null. The assessor's own server gis.clevelandcountyassessor.us did not respond on 2026-10-20. If this item is retired for a newer month, look for a successor in org kxHJSF07PF5lbQ3z."

