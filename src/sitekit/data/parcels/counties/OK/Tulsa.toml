notes = "FeatureServer on INCOG's server, native EPSG:2267 (OK North ftUS, reported as wkid 102724); reprojects on outSR. ParcelNo is a 14-digit string with no dashes, e.g. '00500920140670' (Assessor shows it as 00500-92-01-40670, 5-2-2-5); ACCT_NUM is identical and AccountNo adds an 'R' prefix ('R00500920140670'). Strip dashes from user input and match ParcelNo. PropertyAddress uses Tulsa's trailing quadrant style ('218 W 6 ST S', '500 S DENVER AV W'). PropertyCity is the situs city; City/State/ZIPCode are mailing. ReceptionNo is the County Clerk reception number of the last deed (often null). Legal is space-padded to 250 chars, so trim. INCOG also publishes Creek, Osage, Rogers and Wagoner county parcels on the same server."

