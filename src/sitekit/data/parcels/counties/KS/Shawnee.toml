notes = "MapServer layer (native SR ESRI 102677, KS North ftUS), the source for the county Property Search app. PIN is the 16-digit Kansas parcel number without county prefix or separators ('1093104001003000'); PID is identical; QUICKREFID is the appraiser account ('R26360'); PARCELNUM is only the trailing parcel part, not unique. PADDRESS is situs street ('200 SE 7TH ST'); PADDRESS2 holds ' City, KS  ZIP' with leading space, so city_field is empty (parse from PADDRESS2 if needed). DBOOKPAGE is the latest deed reference, either book/page or an instrument number like '2026R14754'; '-' means none. The old host gis.snco.us timed out, and the hosted copy on services2.arcgis.com/2XE514jeVQMWNKHX is a 2023 snapshot; do not use either."

