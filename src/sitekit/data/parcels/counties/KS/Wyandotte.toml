notes = "MapServer layer 7 'Parcels' (native SR ESRI 102677, KS North ftUS). PARCEL is the 6-character county parcel number with leading zeros ('087645'; PARCEL_NBR is the same as an integer); STATE_ID is the 19-digit Kansas uniform parcel number ('1050621002013001000'); ORIONID is the appraiser account ('R49143'). Situs is split across NUMB (string), DIR, ST_NAME, SUFX with no combined field, so situs_field is empty; ST_NAME can include the type ('7TH ST' + SUFX 'TRFY'). CITY appears to be the situs city. Point queries with inSR=4326 work; NUMB is a string, so quote it in where clauses. Do not use GISPUB/Parcel_Polygons (fewer attributes, editing enabled) or GISPW/PW_Parcels (token required)."

