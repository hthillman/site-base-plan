notes = "MapServer layer 1 of the county's EnerGov service (also feeds the permitting system). GisFile_PIN (same as ParcelPIN) is the TMS PIN with single spaces between groups, e.g. 'R120 003 000 0097 0000' (district letter R/H etc., then 3-3-3-4-4 digits); it is stored only in that spaced form, so a run-together 'R12000300000970000' will not match. GisFile_AIN is the numeric assessor account as a string ('205860'). GisFile_Book/GisFile_Page are the last sale's deed book/page. GisFile_City/State/ZIP belong to the mailing address; GisFile_AreaName is an assessor neighborhood, not a city. Hosted/AddressParcels/FeatureServer/1 is a partial (~39,000 parcel) copy and was not used. First query after idle can be slow; retry."

