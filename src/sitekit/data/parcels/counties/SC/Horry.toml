notes = "Layer 24 'Parcels' of the county parcel-app MapServer (same data as gisweb/rest/services/Public/Parcels/MapServer/1, which caps at 1000 records). PINtext is the 11-digit PIN as text, e.g. '36804030009'; PIN is the same as a number; TMS is the 10-digit tax map number ('1370614010'). No situs address field: OwnerStreet/OwnerCity/OwnerState/OwnerZip are the owner mailing address, and LegalDescr often carries the street or building name. OwnerName can have a trailing space. Condo units appear as stacked parcels (PARCELTYPE, CONDOLABEL)."

