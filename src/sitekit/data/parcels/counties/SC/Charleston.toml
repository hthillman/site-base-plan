notes = "MapServer layer ('Parcels with cama attributes', published for the county's CDC). PID is the 10-digit TMS number with no separators, e.g. '4120000008' (printed as 412-00-00-008); PARCEL_ID is the same value space-padded to 32 characters. Situs address is split across PROP_ST_NO, PROP_ST_NAME and PROP_TYPE (all space-padded) with PROP_CITY as the situs city, so there is no single situs field; concatenate and trim. DEED_BOOK_PAGE looks like 'E107-183', PLAT_BOOK_PAGE like ' AE-129 '. The county's public viewer layer (GIS_VIEWER/External_GIS_Website/MapServer/7) has the same parcels and owner/deed data but no situs address."

