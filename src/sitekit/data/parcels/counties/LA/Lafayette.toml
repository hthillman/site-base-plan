notes = "FeatureServer layer used by LCG's MGO permitting app; answers point queries in well under a second. ASMNTNUM is the bare assessment number, e.g. '6000180'; ASSMT_NUM is the same with a 'PAR-' prefix ('PAR-6000180'). PROPERTY_LOCATION is free text, sometimes a block range ('800 BLK SAINT JOHN ST,') with a trailing comma, and has no city. OWNERS lists all owners joined by ',,'; MAIL_LINE1 holds the first owner name. PROPERTY_TRANSACTIONS lists instrument numbers with dates, not book/page. The sibling BaseLayers/LCG_Parcels_with_CAMA_Data_View service has the same data plus Plat_num but takes ~40 s per outFields=* query, so it was not used."

