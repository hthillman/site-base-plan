notes = "MapServer layer whose only attributes are GEOPIN and PARID ('Parcel geometry that contains GEOPIN and PARID to allow for tabular joins'). PARID is the Assessor's address-style parcel key, house number plus squeezed street name, e.g. '6124-MILNEBL', '1725B-STANDREWST' ('29208-SQUARE' for whole-square government parcels), so it doubles as a rough situs; GEOPIN is the 8-digit GIS parcel number as an integer (41200970). No owner, situs or legal fields. The richer layer at gis.nola.gov/arcgis/rest/services/LGIM/TaxParcelQuery/MapServer/0 (owner, situs, 9-digit TAXBILLID) answers fine in a browser or curl but gis.nola.gov does not send its intermediate TLS certificate, so Python requests fails with CERTIFICATE_VERIFY_FAILED; it was therefore not used. Assessor/Landbase_Layers/MapServer/0 on this host has GEOPIN plus situs parts (SITUS_NUMBER, SITUS_STREET, SITUS_TYPE) if an address is needed."

