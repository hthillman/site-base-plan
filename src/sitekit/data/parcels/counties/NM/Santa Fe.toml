notes = "MapServer layer on the county's own server, native EPSG:2258 (NM Central ftUS, reported as wkid 102713); reprojects on outSR. Field names are lowercase. parcelid is the Assessor parcel/account number, 8 or 9 digits ('910017952'); lowparcelid is the 19-character NM UPC padded with zeros ('1054099180227000000'; condos end in 'CM0001' etc.). Try parcelid first; for a 13-digit UPC from the user, match lowparcelid LIKE '<upc>%'. Text fields are space-padded (siteaddress, ownernme1), so trim. siteaddress has no city; pstlcity is the mailing city. prprtydscrp carries the legal description (TRS, map, block, lots). The building and unit fields hold unrelated values on some records. A TaxDistribution table (id 1) sits on the same service."

