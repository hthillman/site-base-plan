notes = "Hosted FeatureServer, native EPSG:2258 (NM Central ftUS, reported as wkid 102713); reprojects on outSR. Parcel_ID is the NM UPC as a digit string with no dashes, usually 13 digits ('1017073410235') but some are 12 ('101707318061'), so match exactly after stripping dashes and spaces; Account_No is the Assessor account ('R188633'). No situs address field. Bk_Pg is the recorded plat reference as cabinet-page ('3-4996'); Reception_ holds the plat reception number ('2022P01992') when present; both are often blank. Lot, Block, Unit, Tract and Phase are separate fields; Lat/Long are DMS text strings, not numbers. Acrage is text like '9.478 ac'. The City of Rio Rancho publishes its own parcel copy; this county layer is the authoritative one."

