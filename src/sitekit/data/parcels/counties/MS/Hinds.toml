publisher = "Mississippi Department of Environmental Quality parcel project, served by MARIS (gis.mississippi.edu)"
url = "https://gis.mississippi.edu/server/rest/services/Cadastral/MS_MDEQPARCELS_West_2024/MapServer/0"
apn_fields = ["PARNO", "ALTPARNO"]
situs_field = "SITEADD"
