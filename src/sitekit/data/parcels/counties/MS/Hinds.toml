notes = "Hinds County has no public county-run parcel REST service, so this points at the state's MDEQ/MARIS compilation, which is split into a West and an East layer; Hinds is in the West layer. The layer holds many counties, so county_field is CNTYNAME (upper-case name, e.g. 'HINDS') to narrow parcel-number hits; PPIN is a county-local integer that collides across counties, so it is not an apn field. Hinds PARNO is an 18-digit zero-padded string ('000330000034000000'); ALTPARNO is a second 18-digit id. Street right-of-way is one enormous polygon (PARNO '000000000000000010', about 211,000 vertices, ~8 MB as JSON), so a point in a street returns that blob; treat PARNO '000000000000000010' as no parcel. SITEADD is often '0' or blank when the county did not supply a situs; SCITY is the situs city. DEEDREF is 'book - page' (e.g. '3381 - 130'), sometimes '  -' when empty. Data is a 2024 snapshot and lags the county roll."

filter = "CNTYNAME = 'HINDS'"  # shared MDEQ West layer: only this county's parcels

