notes = "Madison County has no public county-run parcel REST service, so this points at the state's MDEQ/MARIS compilation, which is split into a West and an East layer; Madison is in the West layer. The layer holds many counties, so county_field is CNTYNAME (upper-case name, e.g. 'MADISON') to narrow parcel-number hits; PPIN is a county-local integer that collides across counties, so it is not an apn field. Madison PARNO is formatted with dashes, slash and dot, e.g. '093D-19B-101/00.00'; ALTPARNO is a short map code ('0931'). SITEADD is often '0' or blank when the county did not supply a situs; SCITY is the situs city. DEEDREF is 'book - page' (e.g. '3381 - 130'), sometimes '  -' when empty. Data is a 2024 snapshot and lags the county roll."

filter = "CNTYNAME = 'MADISON'"  # shared MDEQ West layer: only this county's parcels

