notes = "Rankin County has no public county-run parcel REST service, so this points at the state's MDEQ/MARIS compilation, which is split into a West and an East layer; Rankin is in the West layer. The layer holds many counties, so county_field is CNTYNAME (upper-case name, e.g. 'RANKIN') to narrow parcel-number hits; PPIN is a county-local integer that collides across counties, so it is not an apn field. Rankin PARNO is a letter, map code and parcel with an embedded space, e.g. 'I08K000082 00000'; ALTPARNO is usually blank. SITEADD is often '0' or blank when the county did not supply a situs; SCITY is the situs city. DEEDREF is 'book - page' (e.g. '3381 - 130'), sometimes '  -' when empty. Data is a 2024 snapshot and lags the county roll."

filter = "CNTYNAME = 'RANKIN'"  # shared MDEQ West layer: only this county's parcels

