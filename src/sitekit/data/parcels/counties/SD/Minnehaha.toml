notes = "MapServer layer 'County Parcels' (same data as MinnEmap/Cadastral/MapServer/0, which allows 2000 records). TAG is the 15-digit parcel tag with no separators, e.g. '012319426006000'; MAP_ID is the dashed form '01-23-19-426-006-000'; MRRDID is the assessor record id ('11142'). FULL_ADDRESS is the situs (blank on many rural parcels); NWLOCN/NWPRED/NWLOCS/NWSTYP are its space-padded parts. MRTNM1/MRTNM2 are owner names and MRTADR/MRTCTY/MRTSTATE/MRTZPC the owner mailing address. SUBDIVISION is a numeric code; ADDITION is the plat name. Assmnt_Year is the year the parcel record was created, not the roll year. The server returns 403 to requests with no User-Agent and occasionally drops a connection; retry. No deed or plat book fields."

