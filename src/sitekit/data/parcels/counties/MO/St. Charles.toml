notes = "Hosted FeatureServer, layer id 2 (not 0). Parcel_ID is the long dashed form with a decimal suffix, e.g. '6-009D-B068-00-0001.0000000'; users often type it without the '.0000000' tail, so try LIKE '6-009D-B068-00-0001%'. Account is the 10-character assessor account ('005520A000'). SiteAddress is situs street with a trailing space ('201 N 2ND ST '). Municipality is the jurisdiction ('City of St Charles', 'Unincorporated'), not a postal city, so city_field is empty. BookPage1 is the deed book-page of the most recent sale ('00980-000554'); BookPage2..4 are earlier sales. The county's own server gis.sccmo.org sits behind a Cloudflare challenge; gis-dev.sccmo.org/scc_gis/rest/services/open_data/Tax_Information_o/FeatureServer/2 serves the same schema as a fallback."

