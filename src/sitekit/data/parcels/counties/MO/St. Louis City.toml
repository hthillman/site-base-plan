notes = "Independent city, a county-equivalent (Census FIPS 29510, NAME 'St. Louis city', BASENAME 'St. Louis'). Geocoders that return BASENAME will say 'St. Louis', the same as St. Louis County (29189), so match on the FIPS or full NAME. HANDLE is the 11-digit city parcel handle ('10207000011'); ParcelId is the Assessor 11-digit id ('02079011000' = city block 0207, parcel 9011, suffix 000); LowerAsrParcelId is its 8-digit form ('02079011'); CityBlock/Parcel are numeric parts. SITEADDR is situs street with runs of spaces ('1200   MARKET ST '), so normalize whitespace before matching. No situs city field (all are St. Louis). RecBookNum/RecPageNum are often null (newer deeds use RecDailyDate/RecDailyNum). Legal continues in LegalDesc2..5. A lighter layer with tax-year attributes is Livedatabase/AssessedValue3/MapServer/0 but it was slow (timed out) at verification."

