notes = "MapServer layer (native SR 3857). PARID is 10 digits with no separators ('1313303009'); DPIN is the dashed form ('13-13-303-009'); PIN is PARID with an '88' county prefix ('881313303009'). PropAdr is the situs street ('940 N BOONVILLE AVE') and L_CITYNAME the situs city. CAUTION: ADRNO/ADRDIR/ADRSTR/CITYNAME are the OWNER MAILING address, not the situs. BOOK/PAGE are the latest deed reference (newer ones use a year in BOOK and an instrument number in PAGE, e.g. '2015' / '04590515'). The assessor publishes many near-duplicate services; ParcelPolygon2 and CountyParcelsNEW answer where-queries but returned nothing for spatial queries at verification, so use this one."

