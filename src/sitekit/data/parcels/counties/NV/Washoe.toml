notes = "FeatureServer layer, native EPSG:3423 (NV West ftUS, reported as wkid 102709); reprojects on outSR. Washoe APNs are 8 digits shown as 'BBB-PPP-PP'. PIN is the dashed string '008-030-10'; STRAP is the same 8 digits with no dashes ('00803010'); APN is an INTEGER with leading zeros dropped (803010), so query it unquoted. Prefer PIN (normalize user input to 3-3-2 with dashes) or STRAP (digits only). FullAddress is the situs street ('1001 E 9TH ST'); CITY is the situs city and SITUSZIP the situs ZIP. Owner name is in LASTNAME (full entity or 'LAST FIRST'), with FIRSTNAME sometimes split out. RECMAP is the recorded map reference such as 'P5791' (parcel map) or '0' when none. MAPLINK points to the Assessor map PDF folder. Stacked condo floors carry FLOOR/FLR."

