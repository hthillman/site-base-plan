notes = "PARCELID is the 17-digit geocode stored without dashes (users often write it as 06-0798-12-4-42-17-0000; strip dashes before querying). CityStateZip is combined, e.g. 'BOZEMAN, MT 59715'. Unparceled polygons (roads/ROW/water) come back with null PARCELID; treat as no parcel. Same data also at services.arcgis.com/qnjIrwR8z5Izc0ij/.../Montana_Cadastral_Framework/FeatureServer/1 (maxRecordCount 1000)."

