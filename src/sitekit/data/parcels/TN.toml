notes = "ADDRESS is street-name-first with the house number last (e.g. 'E MAIN ST 455'), so normalise before matching. GISLINK = 3-digit county id + control map + group + parcel (e.g. '057078P F 00400'); PARCELID adds special-interest and tax year ('057 078P F 00400 000 2026'). PARCEL alone (e.g. '004.00') is not unique; combine with CMAP/GP/COUNTY_NAME. COUNTY_ID is an alphabetical state index (57 = Madison), not FIPS."

