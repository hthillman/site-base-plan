state = "AR"
name = "Parcel Polygon - County Assessor Mapping Program (CAMP)"
publisher = "Arkansas GIS Office (AGISO)"
url = "https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Planning_Cadastre/FeatureServer/6"
apn_fields = ["parcelid"]
situs_field = "adrlabel"
city_field = "adrcity"
county_field = "countyfips"
county_values = "fips"
coverage = "All 75 counties"
vintage = "County CAMA snapshots, scheduled semi-annual updates (pubdate 2026-10-01 on test record)"
max_record_count = 200
terms = "Public; approximate parcel locations, not a legal boundary. Source: Arkansas county assessors via AGISO."
notes = "maxRecordCount is only 200, so page with resultOffset for area queries. countyfips is the 3-digit county FIPS as a string (119 = Pulaski); county holds the name. camakey (numeric) is the CAMA link, not a user-facing parcel number. adrlabel can contain double spaces."

